name: Android APK Auto-Builder

on:
  push:
    branches: [ "main" ] # Runs every time you sync from Google AI Studio
  workflow_dispatch:   # Allows you to trigger the build manually if needed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle Cache
      uses: actions/setup-gradle@v4

    - name: Make Gradle Executable
      run: chmod +x ./gradlew

    - name: Compile Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: My-AI-Studio-App
        path: app/build/outputs/apk/debug/app-debug.apk
